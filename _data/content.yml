- section: 興味・スキル
  text: |
    バックエンド寄りのウェブアプリケーションエンジニア。
    小さな開発チームでの立ち上げから長期の運用まで、ウェブサービスの開発過程全般に興味・スキルがあります。
    AWSを中心にクラウド環境の構築・運用の経験が多く、運用の自動化(GitHub ActionsやCodePipelineでCI/CDの整備、TerraformやCDK/Cloudformationでコード化、監視やログの整備など）を多く手掛けています。
    サーバーサイドの言語はPython, Ruby, Node.js, Java/Scalaあたりが最近経験がありますが、担当する際には特定の言語・フレームワークにこだわりを持たず取り組みます。
    フロントエンドはReact/Next.jsを中心に少しできます。
    自動テストの信奉者です。リレーショナルデータベースを中心としたアーキテクチャ設計を好みます。

